name: Deploy Albany Property Tax Explorer

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ALBANY_GOOGLE_MAPS_KEY: ${{ secrets.ALBANY_GOOGLE_MAPS_KEY }}
      ALBANY_GOOGLE_MAPS_EMBED_KEY: ${{ secrets.ALBANY_GOOGLE_MAPS_KEY }}
      ALBANY_GOOGLE_MAPS_STATIC_KEY: ${{ secrets.ALBANY_GOOGLE_MAPS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build dependencies
        run: npm install

      - name: Verify Google Maps secret
        run: |
          if [ -z "$ALBANY_GOOGLE_MAPS_KEY" ]; then
            echo "::error::Missing ALBANY_GOOGLE_MAPS_KEY repository secret."
            exit 1
          fi

      - name: Build and stage Pages site
        run: npm run check:publish

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
